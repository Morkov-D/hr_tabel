<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#14233c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="description" content="Учет рабочего времени, QR-отметки и график"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>TimeKeeper · Сотрудник</title>
<style>
:root{--navy:#15243d;--blue:#3478fb;--line:#e4eaf4;--muted:#7b899d;--green:#17865e;--bg:#f4f6fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--navy)}button,input,textarea{font:inherit}button{cursor:pointer}h1,h2,h3,p{margin:0}h1{font-size:27px;line-height:1.2;letter-spacing:-.8px}h2{font-size:18px;letter-spacing:-.3px}.app{max-width:540px;min-height:100dvh;margin:auto;background:#f7f9fc;position:relative;padding-bottom:calc(90px + env(safe-area-inset-bottom))}.head{padding:24px 22px 29px;background:linear-gradient(150deg,#14233b,#264976);border-radius:0 0 28px 28px;color:#fff}.head p{color:#c6d4ea}.head .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.avatar{width:38px;height:38px;border-radius:13px;background:#ffffff24;display:grid;place-items:center;font-weight:800}.main{padding:0 18px}.card{border:1px solid var(--line);background:#fff;border-radius:19px;padding:18px;box-shadow:0 6px 20px #23385207}.over{margin-top:-12px;position:relative}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:var(--muted)}.small{font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat{font-size:29px;font-weight:800;line-height:1.1;margin:8px 0 4px;letter-spacing:-1px}.btn{background:var(--blue);color:#fff;border:0;border-radius:14px;min-height:50px;padding:12px 18px;font-weight:750}.btn:disabled{opacity:.55}.btn.ghost{color:var(--navy);background:#eef3ff}.btn.outline{border:1px solid #dbe4f4;background:#fff;color:var(--navy)}.primaryAction{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:16px 18px}.scanIcon{background:#ffffff2e;border-radius:14px;padding:9px;font-size:25px}.tabbar{display:flex;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);background:#fff;border-top:1px solid var(--line);padding:10px 4px calc(9px + env(safe-area-inset-bottom));z-index:5}.tabbar button{flex:1;background:none;border:0;display:grid;justify-items:center;gap:3px;color:#94a1b4;font-size:11px;font-weight:650;padding:3px 0}.tabbar button.active{color:var(--blue)}.tabbar .sym{font-size:22px}.section{margin:24px 0 12px}.day{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid #f0f2f7}.day:last-child{border:0}.dayDate{flex-shrink:0;width:52px;height:51px;background:#f1f5fb;border-radius:13px;display:grid;place-content:center;text-align:center}.dayDate b{font-size:17px}.dayDate span{font-size:11px;color:var(--muted)}.chip{border-radius:20px;padding:5px 9px;background:#e9f6ef;color:var(--green);font-size:12px;font-weight:650}.chip.off{background:#f1f3f8;color:#8b97aa}.input{width:100%;min-height:48px;border:1px solid #dae3ef;border-radius:13px;background:white;padding:12px;outline:0;color:var(--navy)}.input:focus{border-color:#709aff}.field{margin:0 0 15px}.field label{display:block;font-size:12px;color:#66758a;font-weight:700;margin-bottom:7px}.notice{padding:11px 13px;background:#edf3ff;color:#3a5d98;border-radius:11px;font-size:12px}.login{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:32px 24px;background:radial-gradient(circle at 80% 0%,#d7e6ff,transparent 45%),#f5f7fb}.logoIcon{width:59px;height:59px;background:var(--navy);color:#fff;border-radius:19px;display:grid;place-items:center;font-size:32px}.login h1{font-size:35px}.login .btn{width:100%}.viewer{position:fixed;inset:0;background:#0d1421;z-index:40;color:#fff;padding:calc(20px + env(safe-area-inset-top)) 18px 24px;display:flex;flex-direction:column;gap:17px;align-items:center}.viewer video{width:100%;max-width:520px;height:min(60vh,540px);object-fit:cover;border-radius:24px;background:#202c42}.viewbar{max-width:520px;width:100%;display:flex;align-items:center;justify-content:space-between}.scannerWindow{width:220px;height:220px;border:3px solid #a7cbff;border-radius:28px;position:absolute;top:calc(50% - 110px);left:calc(50% - 110px);pointer-events:none;box-shadow:0 0 0 100vmax #0003}.overlay{position:fixed;inset:0;background:#0c1e35bb;z-index:30;display:grid;place-items:center;padding:20px}.dialog{width:100%;max-width:420px;background:white;border-radius:22px;padding:24px}.toast{position:fixed;z-index:90;bottom:100px;left:50%;transform:translateX(-50%);background:#20324d;color:#fff;padding:13px 17px;border-radius:14px;max-width:90%;width:max-content;box-shadow:0 14px 30px #0003}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#23bc79;margin-right:7px}.dot.offline{background:#ffa94d}.skeleton{color:#8a9bb3;text-align:center;padding:24px}.empty{color:var(--muted);text-align:center;padding:30px 10px}.link{background:none;border:0;color:var(--blue);font-weight:700;padding:8px 0}textarea{resize:vertical}
.tabbar .scanNav{position:relative;top:-18px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#3478fb;font-weight:800;min-width:60px}.scanNavIcon{display:grid;place-items:center;height:60px;width:60px;border:5px solid #fff;border-radius:23px;color:#fff;font-size:31px;line-height:1;background:linear-gradient(150deg,#367eff,#225add);box-shadow:0 6px 19px #285fb33b}.tabbar button:focus-visible{outline:2px solid #3478fb;outline-offset:2px}.tabbar .scanNav:active .scanNavIcon{transform:scale(.97)}

/* Async activity and manager decision feedback */
#netState{position:fixed;z-index:110;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;max-width:calc(100vw - 28px);width:max-content;padding:12px 16px;background:#142742;color:#fff;border-radius:14px;font-size:12px;font-weight:700;box-shadow:0 8px 30px #101f3c59;text-align:center}#netState[hidden]{display:none!important}.netCircle{display:inline-block;border-radius:50%;width:18px;height:18px;border:2px solid #8aa6d6;border-top-color:#fff;animation:netRotate .8s linear infinite;flex-shrink:0}@keyframes netRotate{to{transform:rotate(360deg)}}.loadingLine{display:flex;align-items:center;justify-content:center;gap:10px;padding:20px;color:#607390;font-size:13px}.loadingLine .netCircle{border-color:#d2ddf0;border-top-color:#3478fb}.decisionNote{margin:8px 0 17px;padding:12px 13px;background:#f2f6fd;border-radius:12px;font-size:13px}.decisionNote p{margin:6px 0;overflow-wrap:anywhere}.decisionNote.rejectedNote{background:#fff2f1;color:#91394c}.decisionNote .muted{color:#8a6a76}
@media(prefers-reduced-motion:reduce){.netCircle{animation:none}}

/* Two monthly progress cards: confirmed hours and completed shifts */
.monthMetrics{display:grid;gap:12px}.monthMetric{padding:18px 19px}.monthMetric .row b{font-size:14px}.monthPct{border-radius:12px;background:#eff4ff;color:#306ce0;font-size:12px;font-weight:800;padding:4px 9px}.monthNumbers{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:13px 0 14px}.monthNumbers strong{font-size:29px;letter-spacing:-.7px;line-height:1.1}.monthNumbers>span{font-size:13px;color:#66758a;text-align:right}.monthBar{height:10px;overflow:hidden;border-radius:99px;background:#e8eef7;margin-bottom:10px}.monthBar span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#4289ff,#295fe3);transition:width .3s ease}.monthBar.shiftBar span{background:linear-gradient(90deg,#34b68d,#17815c)}
@media(prefers-reduced-motion:reduce){.monthBar span{transition:none}}
</style></head><body><div id="app"><div class="login"><div class="logoIcon">◈</div><h1>TimeKeeper</h1><p class="muted">Подключение...</p></div></div><div id="dialog"></div><div id="toaster"></div><div id="bridgeContainer" style="position:absolute;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden" aria-hidden="true"></div>
<script src="./config.js"></script><script src="./app.js" defer></script></body></html>
